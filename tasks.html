<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeHub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ═══ Login Gate ═══ -->
<div id="login-gate">
  <div class="brand">Life<span>Hub</span></div>
  <p class="tagline">Organise ta vie. Atteins tes objectifs.</p>
  <button id="login-btn" class="btn btn--primary btn--lg">Se connecter avec Google</button>
</div>

<!-- ═══ App Shell ═══ -->
<div id="app" class="app-hidden">

  <!-- Sidebar — desktop -->
  <aside id="sidebar">
    <div class="sidebar-brand">Life<span>Hub</span></div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="today">
        <span class="icon">📅</span><span class="label">Aujourd'hui</span>
      </button>
      <button class="nav-item" data-view="tasks">
        <span class="icon">✅</span><span class="label">Tâches</span>
      </button>
      <button class="nav-item" data-view="habits">
        <span class="icon">🔁</span><span class="label">Habitudes</span>
      </button>
      <button class="nav-item" data-view="goals">
        <span class="icon">🎯</span><span class="label">Objectifs</span>
      </button>
      <button class="nav-item" data-view="calendar">
        <span class="icon">🗓️</span><span class="label">Calendrier</span>
      </button>
      <button class="nav-item" data-view="analytics">
        <span class="icon">📊</span><span class="label">Analyses</span>
      </button>
      <button class="nav-item" data-view="finance">
        <span class="icon">💰</span><span class="label">Finances</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="icon">⚙️</span><span class="label">Réglages</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <img id="user-photo" src="" alt="">
      <span class="name" id="user-name"></span>
      <button id="theme-toggle" class="btn btn--icon sm" title="Thème">🌙</button>
      <button id="logout-btn" class="btn btn--icon sm" title="Déconnexion">🚪</button>
    </div>
  </aside>

  <!-- Main area -->
  <main id="main">
    <!-- Topbar — mobile -->
    <header id="topbar">
      <div class="brand">Life<span>Hub</span></div>
      <div class="flex gap-sm items-center">
        <button id="theme-toggle-m" class="btn btn--icon sm">🌙</button>
        <img id="user-photo-m" src="" alt="" style="width:28px;height:28px;border-radius:50%;">
      </div>
    </header>

    <!-- Notification banner -->
    <div id="notif-banner">
      <span style="flex:1;">Activer les notifications pour ne rien manquer ?</span>
      <button id="notif-enable-btn" class="btn btn--sm btn--primary">Activer</button>
      <button id="notif-dismiss-btn" class="btn btn--sm btn--ghost">✕</button>
    </div>

    <!-- Views container -->
    <div id="views">
      <div id="view-today" class="view active"></div>
      <div id="view-tasks" class="view"></div>
      <div id="view-habits" class="view"></div>
      <div id="view-goals" class="view"></div>
      <div id="view-calendar" class="view"></div>
      <div id="view-analytics" class="view"></div>
      <div id="view-finance" class="view"></div>
      <div id="view-settings" class="view"></div>
    </div>

    <!-- Bottom nav — mobile -->
    <nav id="bottomnav">
      <div class="bottomnav-inner">
        <button class="bnav-item active" data-view="today">
          <span class="icon">📅</span><span>Aujourd'hui</span>
        </button>
        <button class="bnav-item" data-view="tasks">
          <span class="icon">✅</span><span>Tâches</span>
        </button>
        <button class="bnav-item" data-view="habits">
          <span class="icon">🔁</span><span>Habitudes</span>
        </button>
        <button class="bnav-item" data-view="goals">
          <span class="icon">🎯</span><span>Objectifs</span>
        </button>
        <button class="bnav-item" data-view="analytics">
          <span class="icon">📊</span><span>Analyses</span>
        </button>
      </div>
    </nav>
  </main>
</div>

<!-- ═══ Modal container ═══ -->
<div id="modal-root"></div>

<!-- ═══ Toast container ═══ -->
<div class="toast-container" id="toast-root"></div>

<!-- ═══ App script ═══ -->
<script type="module" src="js/app.js"></script>

</body>
</html>
